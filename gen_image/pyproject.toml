[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gen-image"
version = "0.2.0.dev1"
description = "Diffusers Qwen 2.1 image generation with Python workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub",
  "torch",
  "torchvision",
  "torchao>=0.18.0",
  "transformers",
  "diffusers @ git+https://github.com/huggingface/diffusers.git",
  "accelerate",
  "peft",
  "safetensors",
  "numpy",
  "Pillow",
  "psutil",
  "python-frontmatter",
]

[project.urls]
Repository = "https://github.com/dearmadisonblue/deep_research"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.setuptools.package-data]
gen_image = ["pipeline_files.json"]
