[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gen-image"
version = "0.1.0"
description = "Direct-ComfyUI image generation with Python workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=0.34",
  "numpy>=1.26",
  "Pillow>=10",
  "psutil>=5.9",
  "python-frontmatter>=1.1",
]

[project.urls]
Repository = "https://github.com/dearmadisonblue/deep_research"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

